name: Build & Push DockerHub Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: andrescarrillo2001/banquito-sw-frontend:latest
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_APP_SUBTITLE=${{ vars.VITE_APP_SUBTITLE }}
            VITE_MOCK_AUTH_ENABLED=${{ vars.VITE_MOCK_AUTH_ENABLED }}
            VITE_ENVIRONMENT=${{ vars.VITE_ENVIRONMENT }}
            VITE_CORE_KONG_BASE_URL=${{ vars.VITE_CORE_KONG_BASE_URL }}
            VITE_DEFAULT_ADMIN_USER=${{ vars.VITE_DEFAULT_ADMIN_USER }}
            VITE_BASE_PATH=${{ vars.VITE_BASE_PATH }}

      - name: Trigger Infra Deploy
        run: |
          curl -f -i -X POST \
            -H "Authorization: Bearer ${{ secrets.DEVOPS_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/CamilaParedes23/banquito-infra/dispatches \
            -d '{
              "event_type": "deploy-core-front",
              "client_payload": {
                "service": "banca-web"
              }
            }'
